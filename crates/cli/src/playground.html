<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tree-sitter THE_LANGUAGE_NAME</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; }
      header { padding: 1rem; border-bottom: 1px solid #888; }
      h1 { font-size: 1.25rem; margin: 0; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 28rem), 1fr)); }
      section { padding: 1rem; min-width: 0; }
      label, h2 { display: block; font-size: 1rem; font-weight: 600; margin: 0 0 0.5rem; }
      textarea, pre { box-sizing: border-box; width: 100%; min-height: 60vh; padding: 0.75rem; font: 0.9rem/1.5 ui-monospace, monospace; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid #888; margin: 0; }
      #status { padding: 0 1rem; }
    </style>
  </head>
  <body>
    <header><h1>Language: THE_LANGUAGE_NAME</h1></header>
    <p id="status" role="status">Loading parser…</p>
    <main>
      <section><label for="code-input">Code</label><textarea id="code-input" spellcheck="false"></textarea></section>
      <section><h2>Tree</h2><pre id="output-container"></pre></section>
    </main>
    <script type="module" src="playground.js"></script>
  </body>
</html>
