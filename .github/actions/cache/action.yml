name: Cache

description: This action caches fixtures

inputs:
  variant:
    description: Distinguishes fixture sets built differently, such as with Wasm grammars, within the same matrix leg
    default: native

outputs:
  cache-hit:
    description: Cache hit
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - uses: actions/cache@v6.1.0
      id: cache
      with:
        path: |
          test/fixtures/grammars
          target/release/tree-sitter-*.wasm
        key: fixtures-${{ inputs.variant }}-${{ join(matrix.*, '_') }}-${{ hashFiles(
          'crates/generate/src/**',
          'crates/xtask/src/generate.rs',
          'lib/src/parser.h',
          'lib/src/array.h',
          'lib/src/alloc.h',
          'lib/src/wasm-stdlib/external_scanner_stdlib.h',
          'crates/loader/src/**',
          'crates/loader/wasi-sdk-version',
          'crates/loader/binaryen-version',
          'test/fixtures/grammars/*/**/src/*.c',
          'test/fixtures/fixtures.json',
          '.github/actions/cache/action.yml') }}
