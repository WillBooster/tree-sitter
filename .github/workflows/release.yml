name: Release
'on':
  push:
    branches:
      - main
  # script/release.mjs dispatches runs to complete a release that a failed run left pending.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max
permissions:
  id-token: write
  contents: write
  # for script/release.mjs to dispatch runs, and for the reusable workflow to list runs
  actions: write
jobs:
  release:
    uses: WillBooster/reusable-workflows/.github/workflows/release.yml@main
    with:
      github_hosted_runner: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
