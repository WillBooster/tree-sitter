name: Build
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      # The released CLI is built with the wasm feature: the test job builds it with the release profile on the shipping
      # runners, and this step lints its feature-gated sources, tests, and benches.
      - run: cargo clippy -p tree-sitter-cli --all-targets --locked --features wasm
      - uses: taiki-e/install-action@v2.87.27
        with:
          tool: taplo@0.10.0
      - run: taplo check && taplo format --check
      - run: npm ci && npm run lint
        working-directory: lib/binding_web
  # Runs the test suite natively on the platforms that code-gauge and ultra-uni build for.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2025
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The release embeds the published web runtime. The CLI's build script embeds these files if they exist when it
      # first runs for a build configuration, so they are created before any build to compile that embedding here too.
      - run: touch lib/binding_web/web-tree-sitter.js lib/binding_web/web-tree-sitter.wasm
      - run: rustup toolchain install
      - uses: ./.github/actions/cache
        id: cache
      - run: cargo xtask fetch-fixtures
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask generate-fixtures
      - run: cargo test --workspace --locked
      - name: Check the library without the standard library
        run: cargo check -p willbooster-tree-sitter --no-default-features --locked
      # The CLI workflow builds this after each release on the same runners; a failure there leaves the release without
      # its archives.
      - name: Build the CLI as the release attaches it
        if: runner.os != 'Windows'
        run: |
          cargo build --release --locked -p tree-sitter-cli --features wasm
          ./target/release/tree-sitter test --help | grep -q -- --wasm
  test-compact:
    name: test (ABI 16)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: touch lib/binding_web/web-tree-sitter.js lib/binding_web/web-tree-sitter.wasm
      - run: rustup toolchain install
      - uses: ./.github/actions/cache
        id: cache
        with:
          variant: native-abi16
      - run: cargo xtask fetch-fixtures
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask generate-fixtures --abi 16
      - run: cargo test --workspace --locked
  # code-gauge compiles the library for wasm32-wasip1 (Cloudflare Workers), and ultra-uni for Wasm as well.
  wasm:
    name: wasm (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - wasm32-unknown-unknown
          - wasm32-wasip1
    runs-on: ubuntu-latest
    env:
      WASI_SDK_VERSION: '34.0'
      # From the release's asset digest; the download is checked against it before extraction.
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The C sources need a WASI C toolchain for wasm32-wasip1; wasm32-unknown-unknown uses the
      # library's bundled Wasm standard library headers instead.
      - name: Install wasi-sdk
        if: matrix.target == 'wasm32-wasip1'
        run: |
          name="wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location --retry 3 -o wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/${name}.tar.gz"
          echo "${WASI_SDK_SHA256}  wasi-sdk.tar.gz" | sha256sum -c -
          tar -xzf wasi-sdk.tar.gz -C "$RUNNER_TEMP"
          echo "CC_wasm32_wasip1=$RUNNER_TEMP/$name/bin/clang" >> "$GITHUB_ENV"
          echo "AR_wasm32_wasip1=$RUNNER_TEMP/$name/bin/llvm-ar" >> "$GITHUB_ENV"
      - run: cargo build -p willbooster-tree-sitter --release --locked --target ${{ matrix.target }}
      - run: cargo check -p willbooster-tree-sitter --no-default-features --locked --target ${{ matrix.target }}
  # Builds @willbooster/web-tree-sitter and tests it in Node.js, in Cloudflare Workers (workerd, with and without Node.js
  # compatibility), and in Chromium, with grammars built to Wasm the way the grammar repositories build theirs.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.1.1
      - run: rustup toolchain install
      - uses: ./.github/actions/cache
        id: cache
        with:
          variant: wasm
      - run: cargo xtask fetch-fixtures
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask generate-fixtures --wasm
      - name: Test native and Wasmtime parsers
        run: cargo test -p tree-sitter-cli --features wasm --lib --locked
      - run: npm ci
        working-directory: lib/binding_web
      # Without emcc on the runner, xtask builds the Wasm library in the emscripten Docker image.
      - run: npm run build
        working-directory: lib/binding_web
      - run: npm test
        working-directory: lib/binding_web
      - run: npx playwright install --with-deps chromium
        working-directory: lib/binding_web
      - run: npm run test:browser
        working-directory: lib/binding_web
      # The release also publishes the CommonJS bundle and the type declarations.
      - run: CJS=true npm run build && npm run build:dts
        working-directory: lib/binding_web
      - run: node -e "require('@willbooster/web-tree-sitter').Parser.init().then(() => console.log('Loaded the CommonJS bundle'))"
        working-directory: lib/binding_web
      - run: npx tsc -p test/types && npx eslint --no-ignore test/types/cjs.cts
        working-directory: lib/binding_web
  # The single required check for this workflow, so that the ruleset does not have to list each matrix leg.
  build-result:
    if: always()
    needs:
      - lint
      - test
      - test-compact
      - wasm
      - web
    runs-on: ubuntu-latest
    steps:
      - run: '! ${{ contains(needs.*.result, ''failure'') || contains(needs.*.result, ''cancelled'') }}'
